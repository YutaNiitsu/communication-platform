
services:
  # --- バックエンド (Spring Boot) ---
  app:
    build:
      context: ../backend/app
      dockerfile: Dockerfile
    container_name: chat-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      #SPRING_PROFILES_ACTIVE: dev
      TZ: "Asia/Tokyo"
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    restart: always
    networks:
      - chat-net

  # --- フロントエンド (Vue.js / Nginx) ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_WS_BASE_URL=${WS_URL:-ws://192.168.235.5/ws/chat}
        - VITE_API_BASE_URL=${API_URL:-http://192.168.235.5}
    container_name: chat-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro 
    restart: always
    networks:
      - chat-net

  # --- データベース (PostgreSQL) ---
  postgres:
    image: postgres:15
    container_name: chat-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: "Asia/Tokyo"
      PGTZ: "Asia/Tokyo"
    ports:
      - "5432:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
      - ./pg_logs:/var/log/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-net

volumes:
  chat-db-data:

networks:
  chat-net:
    driver: bridge