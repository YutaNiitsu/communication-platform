server {
    listen 80;
    server_name _;
    client_max_body_size 150M;

    # ファイルアップロードを必ず Java に流す（最重要）
    location /messages/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }

    # WebSocket通信（/ws/chat）をバックエンドコンテナにプロキシする
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 明確なAPIリクエストだけを確実にJavaコンテナへプロキシする設定
    # パスの中に auth, channels, users, messages, reactions などのAPIキーワードが含まれる場合のみJavaに流します
    location ~ /(auth|channels|users|messages|clients|reactions|searchs|operation_logs|message_templates|message_template_categories|attachments|storages|configs) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }

    # フロントエンド画面（Vue）の配信 ＆ リロード対策（Historyモード対応）
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # 画面のURL（/homeなど）でリロードされた場合、Nginx内でエラーにせず、
        # 最終的に /index.html をブラウザに返すことで、Vueが起動して正しいチャット画面を再描画します
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
